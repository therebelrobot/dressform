upstream draft_api {
  server dressform:8091;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The editor surface carries an eval-equivalent allowance because it imports the
  # FreeSewing module it emits. That allowance is scoped to this origin; the exported
  # source and the printed SVG carry none. See docs/technical-design.md §9.1.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location = /healthz {
    proxy_pass http://draft_api;
    proxy_set_header Host $host;
  }

  location /draft {
    proxy_pass http://draft_api;
    proxy_set_header Host $host;
  }

  location /designs {
    proxy_pass http://draft_api;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
