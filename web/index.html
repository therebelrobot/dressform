<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dressform</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #faf9f7;
        --fg: #1c1917;
        --muted: #78716c;
        --line: #e7e5e4;
        --ok: #15803d;
        --bad: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1917;
          --fg: #f5f5f4;
          --muted: #a8a29e;
          --line: #292524;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { width: min(36rem, 92vw); }
      h1 { font-size: 1.5rem; margin: 0 0 0.25rem; letter-spacing: -0.015em; }
      p.tag { color: var(--muted); margin: 0 0 2.5rem; }
      .row {
        display: flex;
        gap: 1rem;
        align-items: baseline;
        padding: 0.6rem 0;
        border-top: 1px solid var(--line);
      }
      .key { color: var(--muted); min-width: 11rem; }
      .ok { color: var(--ok); }
      .bad { color: var(--bad); }
      footer { margin-top: 2.5rem; color: var(--muted); font-size: 0.85rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>dressform</h1>
      <p class="tag">Draft flat. Drape true.</p>
      <div class="row"><span class="key">static assets</span><span id="static" class="bad">&hellip;</span></div>
      <div class="row"><span class="key">drafting service</span><span id="api" class="bad">&hellip;</span></div>
      <div class="row"><span class="key">bundle</span><span id="bundle" class="bad">&hellip;</span></div>
      <footer>M0 scaffold &mdash; see <code>docs/technical-design.md</code> &sect;11</footer>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
